[project]
name = "tinyml-esp32"
version = "0.1.0"
description = "TinyML image recognition pipeline for ESP32-S3 with MicroPython deployment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tensorflow>=2.15.0,<2.18",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
tinyml-train = "tinyml.train:main"
tinyml-convert = "tinyml.convert:main"
tinyml-export = "tinyml.export:main"
tinyml-evaluate = "tinyml.evaluate:main"
tinyml-prepare = "tinyml.prepare_data:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["src/tinyml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
